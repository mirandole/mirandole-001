<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ title }}</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f6f7f9;
        color: #1f2933;
      }

      body {
        margin: 0;
        min-height: 100vh;
      }

      main {
        box-sizing: border-box;
        width: min(100%, 760px);
        margin: 0 auto;
        padding: 48px 20px;
      }

      .panel {
        background: #ffffff;
        border: 1px solid #d9dee7;
        border-radius: 8px;
        padding: 24px;
        box-shadow: 0 12px 28px rgb(31 41 51 / 0.08);
      }

      h1 {
        margin: 0 0 12px;
        font-size: 1.75rem;
        line-height: 1.2;
      }

      p {
        line-height: 1.55;
      }

      label {
        display: block;
        margin-bottom: 8px;
        font-weight: 650;
      }

      input,
      select {
        box-sizing: border-box;
        width: 100%;
        min-height: 44px;
        border: 1px solid #b8c2d1;
        border-radius: 6px;
        padding: 8px 10px;
        font: inherit;
      }

      input[type="checkbox"] {
        width: auto;
        min-height: 0;
      }

      button {
        min-height: 40px;
        border: 0;
        border-radius: 6px;
        padding: 8px 14px;
        background: #155e75;
        color: #ffffff;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }

      a {
        color: #155e75;
        font-weight: 650;
      }

      .top-nav {
        display: flex;
        gap: 14px;
        margin-bottom: 18px;
      }

      .secondary-button {
        border: 1px solid #b8c2d1;
        background: #ffffff;
        color: #1f2933;
      }

      .actions {
        display: flex;
        gap: 12px;
        align-items: center;
        margin-top: 18px;
      }

      .compact {
        margin-top: 8px;
      }

      .error {
        color: #b42318;
        font-weight: 650;
      }

      .field-grid {
        display: grid;
        grid-template-columns: 1fr 1fr 160px;
        gap: 14px;
      }

      .stack {
        display: grid;
        gap: 20px;
      }

      .results {
        display: grid;
        gap: 12px;
        margin: 18px 0 0;
        padding: 0;
        list-style: none;
      }

      .filter-form {
        display: grid;
        gap: 12px;
        margin: 18px 0;
      }

      fieldset {
        margin: 0;
        border: 1px solid #d9dee7;
        border-radius: 6px;
        padding: 12px;
      }

      legend {
        padding: 0 4px;
        font-weight: 700;
      }

      .choice {
        display: inline-flex;
        gap: 6px;
        align-items: center;
        margin: 6px 12px 6px 0;
        font-weight: 500;
      }

      .result-card {
        border: 1px solid #d9dee7;
        border-radius: 8px;
        padding: 16px;
      }

      .result-card.consulted {
        background: #f6f7f9;
      }

      .result-card.removing {
        opacity: 0;
        transform: translateY(-4px);
        transition: opacity 140ms ease, transform 140ms ease;
      }

      .result-heading {
        display: flex;
        gap: 12px;
        align-items: start;
        justify-content: space-between;
      }

      .favorite-form {
        margin: 0;
      }

      .result-actions {
        display: flex;
        gap: 8px;
        align-items: center;
      }

      .hide-button,
      .favorite-button {
        min-width: 44px;
        padding: 8px 10px;
        border: 1px solid #b8c2d1;
        background: #ffffff;
        color: #1f2933;
      }

      .hide-button.active {
        border-color: #4b5563;
        background: #eef2f7;
        color: #1f2933;
      }

      .favorite-button.active {
        border-color: #a16207;
        background: #fef3c7;
        color: #78350f;
      }

      .result-card h2 {
        margin: 0 0 8px;
        font-size: 1.1rem;
        line-height: 1.3;
      }

      .meta {
        margin: 0;
        color: #4b5563;
      }

      .failure {
        border-left: 4px solid #b42318;
        background: #fff4f2;
        padding: 12px 14px;
      }

      @media (max-width: 720px) {
        main {
          padding: 24px 14px;
        }

        .field-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <nav class="top-nav" aria-label="Navigation principale">
        <a href="/">Recherche d'offres</a>
        <a href="/favorites">Vue favoris</a>
        <a href="/hidden">Offres masquees</a>
      </nav>
      {% block content %}{% endblock %}
    </main>
    <script>
      (() => {
        const params = new URLSearchParams(window.location.search);
        const scrollY = Number.parseInt(params.get("scroll_y") || "", 10);
        if (Number.isFinite(scrollY) && scrollY >= 0) {
          window.scrollTo({ top: scrollY, left: 0 });
          params.delete("scroll_y");
          const query = params.toString();
          const cleanUrl = `${window.location.pathname}${query ? `?${query}` : ""}${window.location.hash}`;
          window.history.replaceState(null, "", cleanUrl);
        }

        for (const form of document.querySelectorAll('form[action^="/offer-results/"]')) {
          form.addEventListener("submit", () => {
            let input = form.querySelector('input[name="scroll_y"]');
            if (!input) {
              input = document.createElement("input");
              input.type = "hidden";
              input.name = "scroll_y";
              form.append(input);
            }
            input.value = String(Math.max(0, Math.round(window.scrollY)));
          });
        }

        for (const form of document.querySelectorAll("form[data-offer-action]")) {
          form.addEventListener("submit", async (event) => {
            event.preventDefault();

            const button = form.querySelector("button");
            if (button) {
              button.disabled = true;
            }

            try {
              const formData = new FormData(form);
              formData.set("return_to", `${window.location.pathname}${window.location.search}`);
              formData.set("scroll_y", String(Math.max(0, Math.round(window.scrollY))));

              const response = await fetch(form.action, {
                method: form.method,
                body: formData,
                credentials: "same-origin",
                headers: {
                  "X-Mirandole-Async": "1",
                },
              });

              if (!response.ok) {
                form.submit();
                return;
              }

              updateOfferCard(form);
            } catch {
              form.submit();
            } finally {
              if (button && document.contains(button)) {
                button.disabled = false;
              }
            }
          });
        }

        function updateOfferCard(form) {
          const action = form.dataset.offerAction;
          if (action === "hidden") {
            removeOfferCard(form);
            return;
          }

          if (action === "favorite") {
            updateFavoriteState(form);
          }
        }

        function updateFavoriteState(form) {
          const card = form.closest(".result-card");
          const button = form.querySelector(".favorite-button");
          if (!card || !button) {
            return;
          }

          const isFavorite = button.classList.toggle("active");
          button.textContent = isFavorite ? "★" : "☆";
          button.setAttribute(
            "aria-label",
            isFavorite ? "Retirer des Offres favorites" : "Ajouter aux Offres favorites",
          );
          button.setAttribute(
            "title",
            isFavorite ? "Offre favorite" : "Ajouter aux Offres favorites",
          );

          if (window.location.pathname === "/favorites" && !isFavorite) {
            removeOfferCard(form);
            return;
          }

          let favoriteMeta = card.querySelector(".favorite-meta");
          if (isFavorite && !favoriteMeta) {
            favoriteMeta = document.createElement("p");
            favoriteMeta.className = "meta favorite-meta";
            favoriteMeta.textContent = "Offre favorite";
            card.querySelector(".result-heading")?.after(favoriteMeta);
          } else if (!isFavorite && favoriteMeta) {
            favoriteMeta.remove();
          }
        }

        function removeOfferCard(form) {
          const card = form.closest(".result-card");
          const list = card?.parentElement;
          if (!card || !list) {
            return;
          }

          card.classList.add("removing");
          window.setTimeout(() => {
            card.remove();
            if (!list.querySelector(".result-card")) {
              const emptyMessage = document.createElement("p");
              emptyMessage.textContent = emptyMessageForCurrentPage();
              list.replaceWith(emptyMessage);
            }
          }, 140);
        }

        function emptyMessageForCurrentPage() {
          if (window.location.pathname === "/favorites") {
            return "Aucune Offre favorite.";
          }
          if (window.location.pathname === "/hidden") {
            return "Aucune Offre masquee.";
          }
          return "Aucun Resultat d'offre pour cette Session de recherche.";
        }
      })();
    </script>
  </body>
</html>
