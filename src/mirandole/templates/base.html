<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ title }}</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f6f7f9;
        color: #1f2933;
      }

      body {
        margin: 0;
        min-height: 100vh;
      }

      main {
        box-sizing: border-box;
        width: min(100%, 760px);
        margin: 0 auto;
        padding: 48px 20px;
      }

      .panel {
        background: #ffffff;
        border: 1px solid #d9dee7;
        border-radius: 8px;
        padding: 24px;
        box-shadow: 0 12px 28px rgb(31 41 51 / 0.08);
      }

      h1 {
        margin: 0 0 12px;
        font-size: 1.75rem;
        line-height: 1.2;
      }

      p {
        line-height: 1.55;
      }

      label {
        display: block;
        margin-bottom: 8px;
        font-weight: 650;
      }

      input {
        box-sizing: border-box;
        width: 100%;
        min-height: 44px;
        border: 1px solid #b8c2d1;
        border-radius: 6px;
        padding: 8px 10px;
        font: inherit;
      }

      button {
        min-height: 40px;
        border: 0;
        border-radius: 6px;
        padding: 8px 14px;
        background: #155e75;
        color: #ffffff;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }

      .actions {
        display: flex;
        gap: 12px;
        align-items: center;
        margin-top: 18px;
      }

      .error {
        color: #b42318;
        font-weight: 650;
      }
    </style>
  </head>
  <body>
    <main>
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
